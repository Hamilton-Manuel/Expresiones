<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    # No registrar el query string de búsquedas con posibles datos de entrada.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" regexlab
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 regexlab
</VirtualHost>
